name: Web production
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run test:publishing
      - run: npm run test:production
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-production-node-${{ matrix.node }}
          path: dist/
          if-no-files-found: error
