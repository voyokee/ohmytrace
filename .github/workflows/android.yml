name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run build:android -- lintDebug assembleDebugAndroidTest assembleRelease
      - name: Checksums
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release-unsigned.apk > android/app/build/outputs/apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: oncehere-android
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-diagnostics
          path: android/app/build/reports/
