<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>我的足迹</title>
<link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css">
<link rel="stylesheet" href="styles.css?v=20261026-mobile-clear">
<link rel="stylesheet" href="src/life/story/story.css?v=20261026-story">
<script>window.CESIUM_BASE_URL = 'vendor/cesium/';</script>
<script src="vendor/cesium/Cesium.js" defer></script>
<script src="app.js?v=20261026-mobile-clear" defer></script>
</head>
<body>
<div id="globe"></div>
<div id="vignette"></div>
<div id="markers"></div>

<header id="brand">
  <div class="eyebrow">MY FOOTPRINTS</div>
  <h1>我的足迹</h1>
  <div id="stats" class="stats"></div>
  <div id="chips" class="chips"></div>
</header>

<nav id="toolbar">
  <button id="btn-life" class="tb" title="人生阶段" aria-label="人生阶段" data-tooltip="人生阶段"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5C9 3.8 5.5 3.8 3 4.5v14c3-.7 6-.5 9 1 3-1.5 6-1.7 9-1v-14c-2.5-.7-6-.7-9 1ZM12 5.5v14M6 8l3 .5M15 8.5l3-.5M6 12l3 .5M15 12.5l3-.5"/></svg></button>
  <button id="btn-photos" class="tb" title="从相册恢复足迹" aria-label="从相册恢复足迹" data-tooltip="从相册恢复足迹"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg></button>
  <button id="btn-tone" class="tb" title="切换足迹夜景（N）" aria-label="切换足迹夜景" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M20.5 13.2A8.7 8.7 0 0110.8 3.5a8.7 8.7 0 109.7 9.7z"/></svg>
  </button>
  <button id="btn-home" class="tb" title="回到地球（Esc）" aria-label="回到地球">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.3 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.3-3.8-8.5s1.2-6.1 3.8-8.5z"/></svg>
  </button>
  <button id="btn-list" class="tb" title="旅行列表" aria-label="旅行列表">
    <svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.75" cy="6.5" r="1.1"/><circle cx="4.75" cy="12" r="1.1"/><circle cx="4.75" cy="17.5" r="1.1"/></svg>
  </button>
  <button id="btn-data" class="tb" title="导入与编辑数据" aria-label="导入与编辑数据">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.7"/><path d="M5 6v12c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7V6M5 12c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7"/></svg>
    <span class="tb-dot" id="data-dot" hidden></span>
  </button>
</nav>

<aside id="list" class="glass">
  <div class="panel-head">
    <h3>旅行 <span id="list-count" class="count"></span></h3>
    <span id="list-filter"></span>
    <button class="x" id="list-close" aria-label="关闭">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="legend" class="legend"></div>
  <div id="list-body" class="scroll"></div>
</aside>

<section id="card" class="glass" aria-live="polite"></section>

<footer id="timeline" class="glass">
  <div id="chapter-filter" role="group" aria-label="人生阶段筛选" hidden></div>
  <div id="year-filter" role="group" aria-label="显示年份"></div>
  <div class="tl-playback">
  <button id="btn-play" class="play" title="按时间顺序回放" aria-label="回放"></button>
  <div class="tl-main" tabindex="0" role="group" aria-label="足迹时间轴，可左右滚动，Home 到最早，End 到最新"><div id="tl-track" class="tl-track"></div></div>
  <div id="tl-status" class="tl-status"></div>
  </div>
</footer>

<div id="pickbar" class="glass"></div>

<div id="empty" class="glass">
  <div class="empty-title">找回你去过的地方</div>
  <p>从相册选择旅行照片，在你的设备上读取拍摄时间和地点，把走过的地方点亮在地球上。原图不会上传。</p>
  <button class="btn primary" id="empty-photos">从相册选择照片</button>
  <button class="btn" id="empty-demo" hidden>先看看示例</button>
  <button class="empty-link" id="empty-import">已有 CSV 或备份文件？导入</button>
</div>

<div id="modal">
  <div class="dialog">
    <div class="dlg-head">
      <div class="tabs" role="tablist">
        <button data-tab="import">导入</button>
        <button data-tab="edit">编辑</button>
        <button data-tab="places">地点校正 <span id="tab-badge" class="tab-badge"></span></button>
      </div>
      <button class="x" id="modal-close" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="dlg-body" class="dlg-body scroll"></div>
  </div>
</div>

<div id="toast"></div>
<p id="life-storage-error" class="glass" role="alert" hidden></p>
<dialog id="life-dialog" class="dialog glass" aria-label="人生阶段管理"></dialog>
<dialog id="photo-dialog" class="dialog glass" aria-label="从相册恢复足迹"></dialog>
<div id="credits"><span>全球素材 NASA/GSFC · GEBCO</span></div>

<div id="loader">
  <div class="ld-inner">
    <div class="ld-orb"></div>
    <div class="ld-title">我的足迹</div>
    <div class="ld-sub" id="ld-sub">正在载入地球…</div>
  </div>
</div>
</body>
</html>
